name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive_name: ryoiki-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            archive_name: ryoiki-aarch64-unknown-linux-gnu.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ryoiki-release-${{ matrix.target }}"
          save-if: true

      - name: Install cross-compilation toolchain for ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/ryoiki staging/
          cd staging
          tar -czf ../${{ matrix.archive_name }} ryoiki
          cd ..

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive_name }}

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 領域 (Ryoiki) ${{ github.ref_name }}
          files: artifacts/*.tar.gz
          generate_release_notes: true
          append_body: true
          body: |
            > [!TIP]
            > ### Quick Remote Installation
            > ```bash
            > curl -fsSL https://raw.githubusercontent.com/Praveensenpai/ryoiki/main/remote-install.sh | bash
            > ```
            > - **Standard 64-bit Servers (Intel / AMD)**: `ryoiki-x86_64-unknown-linux-gnu.tar.gz`
            > - **ARM64 Servers (AWS Graviton, Ampere, Raspberry Pi)**: `ryoiki-aarch64-unknown-linux-gnu.tar.gz`
