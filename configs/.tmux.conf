# ==============================================================================
#  領域 (Ryoiki) - Tmux Configuration
# ==============================================================================

# Enable mouse mode (scrolling, clicking, resizing panes)
set -g mouse on

# Terminal & color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Increase history / scrollback limit
set -g history-limit 50000

# Remove escape key delay (better for Neovim/vim)
set -s escape-time 0

# Vi mode for copy and search
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection

# Easy config reload: prefix + r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
