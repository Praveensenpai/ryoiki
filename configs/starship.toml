# ==============================================================================
#  領域 (Ryoiki) - Starship Prompt Configuration
# ==============================================================================

# Inserts a blank line between shell prompts
add_newline = true

# Format layout
format = """
$directory\
$git_branch\
$git_status\
$golang\
$rust\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[✗](bold red)"

[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"

[golang]
symbol = " "
style = "bold cyan"

[rust]
symbol = " "
style = "bold red"

[python]
symbol = " "
style = "bold yellow"

[docker_context]
symbol = " "
style = "bold blue"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
